[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tactical-radio-cognitive-gateway"
version = "0.1.0"
description = "Synthetic defensive lab for radio-link ML classification and dynamic gateway policy."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Carlos Albert Fillol" }]
dependencies = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "pydantic>=2.7.0", "numpy>=1.26.0", "scikit-learn>=1.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
